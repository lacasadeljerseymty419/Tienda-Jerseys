<!DOCTYPE html>
<html lang="es" class="light">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Catálogo Público - Jersey Store</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: {
                        navy: { 400: '#3b82f6', 500: '#2563eb', 600: '#1d4ed8', 700: '#1e3a8a' },
                        light: { 100: '#f8fafc', 200: '#f1f5f9', 300: '#e2e8f0', 400: '#cbd5e1' }
                    }
                }
            }
        }
    </script>
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Plus Jakarta Sans', sans-serif; background-color: #f8fafc; color: #0f172a; overflow-x: hidden; }
        ::-webkit-scrollbar { width: 8px; }
        ::-webkit-scrollbar-track { background: #f1f5f9; }
        ::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 4px; }
        ::-webkit-scrollbar-thumb:hover { background: #94a3b8; }
        .no-scrollbar::-webkit-scrollbar { display: none; }
        .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
    </style>
</head>
<body class="bg-light-100 min-h-screen flex flex-col pt-16">
    <!-- Header Fijo -->
    <header class="fixed top-0 left-0 right-0 h-16 bg-white border-b border-gray-200 z-40 flex items-center justify-between px-4 sm:px-8 shadow-sm">
        <div class="flex items-center gap-4">
            <div class="text-xl sm:text-2xl font-extrabold tracking-tighter text-navy-600 flex items-center gap-2">
                <svg class="w-6 h-6 sm:w-8 sm:h-8" fill="currentColor" viewBox="0 0 24 24"><path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm-1 17.93c-3.95-.49-7-3.85-7-7.93 0-.62.08-1.21.21-1.79L9 15v1c0 1.1.9 2 2 2v1.93zm6.9-2.54c-.26-.81-1-1.39-1.9-1.39h-1v-3c0-.55-.45-1-1-1H8v-2h2c.55 0 1-.45 1-1V7h2c1.1 0 2-.9 2-2v-.41c2.93 1.19 5 4.06 5 7.41 0 2.08-.8 3.97-2.1 5.39z"/></svg>
                STORE
            </div>
        </div>
        <div class="flex items-center gap-4">
            <!-- Espacio reservado si a futuro se agregan otros botones públicos -->
        </div>
    </header>

    <main class="flex-grow flex flex-col sm:flex-row relative z-10 w-full max-w-7xl mx-auto">
        <!-- Sidebar de Filtros Desktop -->
        <aside class="hidden sm:block w-64 bg-white border-r border-gray-200 h-[calc(100vh-4rem)] sticky top-16 overflow-y-auto flex-shrink-0 z-20 shadow-sm">
            <div class="p-6 h-full flex flex-col">
                <h3 class="text-xs font-bold text-gray-500 uppercase tracking-wider mb-6">Filtros de Búsqueda</h3>
                
                <div class="space-y-5 flex-grow" id="container-filtros">
                    <div class="space-y-1.5">
                        <label class="text-[10px] font-semibold text-gray-400 uppercase">Nombre</label>
                        <input type="text" id="filter-nombre" placeholder="Buscar jersey..." class="w-full bg-gray-50 border border-gray-200 rounded-lg px-3 py-2 text-sm focus:outline-none focus:border-navy-500 text-gray-800 placeholder-gray-400 transition-colors">
                    </div>
                    <div class="space-y-1.5">
                        <label class="text-[10px] font-semibold text-gray-400 uppercase">Tipo</label>
                        <select id="filter-tipo" class="w-full bg-gray-50 border border-gray-200 rounded-lg px-3 py-2 text-sm focus:outline-none focus:border-navy-500 text-gray-800 appearance-none cursor-pointer">
                            <option value="">Todos los tipos</option>
                        </select>
                    </div>
                    <div class="space-y-1.5">
                        <label class="text-[10px] font-semibold text-gray-400 uppercase">Versión</label>
                        <select id="filter-version" class="w-full bg-gray-50 border border-gray-200 rounded-lg px-3 py-2 text-sm focus:outline-none focus:border-navy-500 text-gray-800 appearance-none cursor-pointer">
                            <option value="">Todas las versiones</option>
                        </select>
                    </div>
                    <div class="space-y-1.5">
                        <label class="text-[10px] font-semibold text-gray-400 uppercase">Género</label>
                        <select id="filter-genero" class="w-full bg-gray-50 border border-gray-200 rounded-lg px-3 py-2 text-sm focus:outline-none focus:border-navy-500 text-gray-800 appearance-none cursor-pointer">
                            <option value="">Todos los géneros</option>
                        </select>
                    </div>
                </div>

                <div class="mt-6 pt-6 border-t border-gray-200">
                    <button id="btn-aplicar" class="w-full py-2.5 bg-navy-600 hover:bg-navy-700 text-white font-bold rounded-xl transition-all shadow-md hover:shadow-lg hover:shadow-navy-500/20 text-sm flex justify-center items-center gap-2">
                        <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z"></path></svg>
                        Buscar
                    </button>
                </div>
            </div>
        </aside>

        <!-- Barra de Búsqueda Móvil y Toggle Filtros -->
        <div class="sm:hidden p-4 bg-white border-b border-gray-200 sticky top-16 z-30 shadow-sm">
            <div class="flex gap-2">
                <input type="text" id="mobile-search-input" placeholder="Buscar jersey..." class="flex-grow bg-gray-50 border border-gray-200 rounded-lg px-4 py-2.5 text-sm focus:outline-none focus:border-navy-500 text-gray-800 placeholder-gray-400 transition-colors">
                <button id="btn-toggle-filters" class="px-4 py-2.5 bg-gray-100 border border-gray-200 rounded-lg text-gray-600 hover:text-navy-600 hover:bg-gray-200 transition-colors flex items-center justify-center">
                    <svg id="icon-toggle-filters" class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 4a1 1 0 011-1h16a1 1 0 011 1v2.586a1 1 0 01-.293.707l-6.414 6.414a1 1 0 00-.293.707V17l-4 4v-6.586a1 1 0 00-.293-.707L3.293 7.293A1 1 0 013 6.586V4z"></path></svg>
                </button>
            </div>
            
            <!-- Panel colapsable de filtros móviles -->
            <div id="mobile-filters-panel" class="hidden mt-3 space-y-3 pt-3 border-t border-gray-200">
                <select id="mobile-filter-tipo" class="w-full bg-gray-50 border border-gray-200 rounded-lg px-3 py-2 text-sm focus:outline-none focus:border-navy-500 text-gray-800 appearance-none cursor-pointer">
                    <option value="">Todos los tipos</option>
                </select>
                <select id="mobile-filter-version" class="w-full bg-gray-50 border border-gray-200 rounded-lg px-3 py-2 text-sm focus:outline-none focus:border-navy-500 text-gray-800 appearance-none cursor-pointer">
                    <option value="">Todas las versiones</option>
                </select>
                <select id="mobile-filter-genero" class="w-full bg-gray-50 border border-gray-200 rounded-lg px-3 py-2 text-sm focus:outline-none focus:border-navy-500 text-gray-800 appearance-none cursor-pointer">
                    <option value="">Todos los géneros</option>
                </select>
                <button id="btn-aplicar-mobile" class="w-full py-2.5 bg-navy-600 hover:bg-navy-700 text-white font-bold rounded-lg transition-all shadow-md text-sm">
                    Aplicar Filtros
                </button>
            </div>
        </div>

        <!-- Contenido Principal (Grid) -->
        <section class="flex-grow p-4 sm:p-6 lg:p-8 w-full min-w-0">
            <div class="mb-6 flex justify-between items-end">
                <div>
                    <h2 class="text-xl sm:text-2xl font-bold text-gray-900 tracking-tight">Catálogo</h2>
                    <p class="text-sm text-gray-500 mt-1">Nuestra colección completa de jerseys.</p>
                </div>
                <div class="text-xs sm:text-sm text-gray-500 font-medium">
                    <span id="results-count" class="text-navy-600 font-bold">0</span> resultados
                </div>
            </div>

            <!-- Grid de Productos -->
            <div id="products-grid" class="grid grid-cols-2 lg:grid-cols-3 xl:grid-cols-4 gap-3 sm:gap-4 lg:gap-6">
                <!-- Se inyectan productos con JS -->
            </div>

            <!-- Estado Vacío -->
            <div id="empty-state" class="hidden flex-col items-center justify-center py-20 text-center">
                <div class="w-20 h-20 bg-gray-200 rounded-full flex items-center justify-center mb-4">
                    <svg class="w-10 h-10 text-gray-400" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z"></path></svg>
                </div>
                <h3 class="text-lg font-bold text-gray-900 mb-2">No se encontraron jerseys</h3>
                <p class="text-gray-500 text-sm max-w-sm mx-auto">Prueba modificando tus filtros o buscando con otros términos.</p>
                <button onclick="document.getElementById('filter-nombre').value=''; document.getElementById('mobile-search-input').value=''; document.getElementById('btn-aplicar').click();" class="mt-6 px-6 py-2 bg-gray-200 hover:bg-gray-300 text-gray-800 font-bold rounded-lg transition-colors text-sm">
                    Limpiar filtros
                </button>
            </div>
        </section>
    </main>

    <!-- Modal Visor de Imagen Ampliada -->
    <div id="image-modal" class="fixed inset-0 z-50 flex items-center justify-center hidden bg-black/80 backdrop-blur-sm transition-opacity duration-300 opacity-0 p-4">
        <button id="close-modal" class="absolute top-4 right-4 sm:top-6 sm:right-6 text-white/70 hover:text-white transition-colors bg-black/40 hover:bg-black/60 rounded-full p-2">
            <svg class="w-6 h-6 sm:w-8 sm:h-8" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"></path></svg>
        </button>
        <img id="modal-image" src="" alt="Vista Ampliada" class="max-w-full max-h-[85vh] object-contain rounded-lg shadow-2xl transform scale-95 transition-transform duration-300">
    </div>

    <template id="skeleton-template">
        <div class="bg-white rounded-2xl p-3 sm:p-4 border border-gray-200 shadow-sm animate-pulse">
            <div class="w-full aspect-square bg-gray-200 rounded-xl mb-4"></div>
            <div class="h-4 bg-gray-200 rounded w-3/4 mb-3"></div>
            <div class="flex gap-2 mb-4">
                <div class="h-3 bg-gray-200 rounded w-1/3"></div>
                <div class="h-3 bg-gray-200 rounded w-1/3"></div>
            </div>
            <div class="flex justify-between items-end mb-4">
                <div class="h-5 bg-gray-200 rounded w-1/2"></div>
                <div class="h-3 bg-gray-200 rounded w-1/4"></div>
            </div>
            <div class="h-10 bg-gray-200 rounded-xl w-full"></div>
        </div>
    </template>

    <script src="./js/catalogo.js?v=1.0.1"></script>
</body>
</html>
